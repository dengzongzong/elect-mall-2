server {
    listen 80 default_server;
    server_name _;
    root /var/www/elect-mall/crmeb/public;
    client_max_body_size 100m;
    charset utf-8;

    # PC 前端首页
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 管理后台
    location /admin/ {
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # H5 移动端
    location /mobile/ {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 路由
    location /api/ {
        try_files $uri $uri/ /index.php?s=$uri&$args;
    }

    # 修复工具（临时）
    location = /fix_all.php {
        try_files $uri /index.php?s=$uri&$args;
    }

    # Webhook 部署
    location = /deploy/webhook.php {
        root /var/www/elect-mall;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/deploy/webhook.php;
    }

    # PHP 处理
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control public;
    }

    # 禁止访问
    location ~ /\. {
        deny all;
    }
    location ~ /(runtime|vendor)/ {
        deny all;
    }
}